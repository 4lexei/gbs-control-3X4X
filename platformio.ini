; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
lib_dir = ./lib/
src_dir = ./

[env:gbsc]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
board_build.flash_mode = qio
upload_speed = 460800
monitor_speed = 115200
lib_deps =  
    esp32async/ESPAsyncTCP@^2.0.0
    esp32async/ESPAsyncWebServer@^3.10.3
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.2
    ;bluemurder/ESP8266-ping@^2.0.1
build_src_filter =
  +<**/*.c>
  +<**/*.cpp>
  +<**/*.ino>
  -<./3rdparty/*>

; 3X4X: the same firmware with the web in English (webui/build/webui_html_en.h, built from webui/lang/en.json).
; One language per firmware: "pio run -e gbsc" is Spanish, "pio run -e gbsc_en" is English.
[env:gbsc_en]
extends = env:gbsc
build_flags = -DWEBUI_LANG_EN

; 3X4X (after v120), his decision of 2026-11-21: the ESP32 environment is commented out, not deleted. Nobody here has an
; ESP32 to test on, so an environment that shows up in the IDE and has never been built only confuses people. The ESP32
; branches in the code (Config.h pin map, the WiFi / mDNS / OTA includes, micros() for the periods) are untouched: to try
; it again, uncomment this and build "pio run -e gbsc_esp32".
